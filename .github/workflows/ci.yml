name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      # The schema integration tests need a real server: they apply migrations,
      # read an EXPLAIN plan and rely on a partial unique index, none of which a
      # fake would prove anything about. PostgreSQL 18 matches development; the
      # schema itself needs 13 or later, for gen_random_uuid().
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: flowboard
          POSTGRES_PASSWORD: flowboard
          POSTGRES_DB: flowboard_test
        ports:
          - 5432:5432
        # Without this the job can start querying before the server accepts
        # connections, which fails as a confusing timeout rather than a clear
        # error.
        options: >-
          --health-cmd "pg_isready -U flowboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the development machine. When a deployment target is chosen,
          # this should match that too.
          node-version: 24
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install
        working-directory: Backend
        run: npm ci

      - name: Test
        working-directory: Backend
        env:
          TEST_DATABASE_URL: postgres://flowboard:flowboard@localhost:5432/flowboard_test
          # A suite that quietly stopped collecting files would still be green,
          # so the count is asserted rather than trusted. This is not
          # hypothetical: `src/**/*.test.js` unquoted collects 180 of 201 here,
          # because `**` is not recursive in POSIX sh.
          #
          # Raise this when adding tests. A drop means something stopped being
          # collected, which is worth failing over.
          MINIMUM_TESTS: 448
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          total=$(grep -oE 'tests [0-9]+' test-output.txt | grep -oE '[0-9]+' | tail -1)
          echo "collected ${total:-no} tests, expected at least $MINIMUM_TESTS"
          if [ -z "$total" ] || [ "$total" -lt "$MINIMUM_TESTS" ]; then
            echo "::error::Collected ${total:-no} tests; expected at least $MINIMUM_TESTS."
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install
        working-directory: Frontend
        run: npm ci

      - name: Lint
        working-directory: Frontend
        run: npm run lint

      # This suite also guards the duplicated operation contract:
      # operationContract.test.js reads the backend's copy by relative path.
      # That works with only the frontend installed, because neither copy has a
      # dependency outside Node itself — which is why there is no separate job
      # for it.
      - name: Test
        working-directory: Frontend
        env:
          MINIMUM_TESTS: 276
        run: |
          set -o pipefail
          npm run test:realtime 2>&1 | tee test-output.txt
          total=$(grep -oE 'tests [0-9]+' test-output.txt | grep -oE '[0-9]+' | tail -1)
          echo "collected ${total:-no} tests, expected at least $MINIMUM_TESTS"
          if [ -z "$total" ] || [ "$total" -lt "$MINIMUM_TESTS" ]; then
            echo "::error::Collected ${total:-no} tests; expected at least $MINIMUM_TESTS."
            exit 1
          fi

      - name: Build
        working-directory: Frontend
        run: npm run build
