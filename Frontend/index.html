<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline data URI: the brand tile (ink) with the diamond glyph, lit top to bottom. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="./src/assets/logo/logo.png"
    />
    <!-- viewport-fit=cover lets the mobile dock pad for the home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Updated by ThemeManager so browser chrome matches the canvas. -->
    <meta name="theme-color" content="#f8f8f7" />
    <meta
      name="description"
      content="FlowBoard — a collaborative whiteboard for sketching, diagramming and thinking together."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>FlowBoard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
